<head>

<title>오리 레이스</title>

<style>
:root{--br:#3b2412;--bn:#6b4423;--cr:#fff6d8;--gr:#5aa832;--gd:#2e6b16}
*{box-sizing:border-box}
html,body{margin:0;background:#2b1d10;font-family:'Galmuri11','Galmuri9',sans-serif;color:var(--br)}
button,input,select{font-family:inherit}
.scr{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cr);border-left:3px solid var(--gd);border-right:3px solid var(--gd);display:flex;flex-direction:column}
.hd{background:var(--gr);border-bottom:3px solid var(--gd);padding:9px 12px;display:flex;justify-content:space-between;font-size:15px;color:#ffe14d}
.bd{padding:14px;display:flex;flex-direction:column;gap:11px}
.hidden{display:none!important}
.lb{font-size:14px;color:var(--bn)}
.h1{font-size:20px;text-align:center;margin:6px 0}
.box{border:3px solid var(--bn);background:#fff;padding:8px}
canvas{display:block;width:100%;image-rendering:pixelated}
.sw{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.sw button{aspect-ratio:1;border:2px solid var(--br);border-radius:0;padding:0;cursor:pointer}
.sw button.on{outline:3px solid #e0a800;outline-offset:1px}
.ac{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.ac button,.tg2 button,select,.nm button{font-size:14px;background:#fff;color:var(--br);border:2px solid var(--bn);border-radius:0;padding:7px 2px;cursor:pointer}
.ac button.on,.tg2 button.on{background:var(--bn);color:var(--cr)}
.nm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.nm button.tk{background:#e2d7bf;color:#9a8b6e;border-color:#b9ab8c}
.big{font-size:17px;padding:11px 0;border:3px solid var(--gd);border-radius:0;background:var(--gr);color:#fff;cursor:pointer;width:100%}
.big.red{background:#e5484d;border-color:#7a1f1f}
.big.off{background:#b9ab8c;border-color:var(--bn)}
.small{font-size:13px;background:none;border:none;color:var(--bn);text-decoration:underline;cursor:pointer;padding:4px}
input.code{font-size:30px;letter-spacing:.3em;text-align:center;padding:10px;border:3px solid var(--bn);width:100%;border-radius:0;background:#fff;color:var(--br)}
.err{color:#c0392b;font-size:14px;min-height:20px;text-align:center}
.it{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.it button{font-size:13px;background:#fff;color:var(--br);border:2px solid var(--bn);border-radius:0;padding:6px 2px;cursor:pointer;line-height:1.3}
.it button i{display:block;font-style:normal;font-size:24px}
.it button.on{background:#ffe9a8;outline:3px solid #e0a800;outline-offset:-3px}
.itd{font-size:13px;color:var(--bn);min-height:18px}
#sRace{flex:1}
#qk{flex:1;min-height:34vh;font-size:44px;background:#f76b15;border:4px solid #7a3a0a;box-shadow:0 6px 0 #7a3a0a;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#qk small{display:block;font-size:14px;margin-top:6px;opacity:.9}
#qk.hit{transform:translateY(4px);box-shadow:0 2px 0 #7a3a0a;background:#ff8a3d}
.myit{font-size:13px;color:var(--bn);background:#fff;border:2px solid var(--bn);padding:4px 8px}
.rotbtn{align-self:flex-end;font-family:inherit;font-size:13px;background:#fff;color:var(--br);border:2px solid var(--bn);border-radius:0;padding:4px 10px;cursor:pointer;margin-bottom:-4px}
body.land .scr{max-width:none;min-height:100vh;border:0}
body.land .hd{padding:3px 10px;font-size:13px}
body.land #sRace{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(140px,34%);grid-template-rows:auto auto auto auto 1fr auto;grid-template-areas:"st qk" "it qk" "ev qk" "ml qk" "map qk" "tip qk";gap:5px 10px;padding:6px 10px 8px;flex:1}
body.land .myit{grid-area:it;padding:2px 8px}
body.land .rstat{grid-area:st}body.land .rstat .stat b{font-size:16px}body.land .rstat .stat div{padding:2px 0}
body.land #ev{grid-area:ev;min-height:0;padding:4px 8px;font-size:13px}
body.land .rmaplb{grid-area:ml;font-size:12px}body.land .rmap{grid-area:map;align-self:start}
body.land #qk{grid-area:qk;height:100%;min-height:0;font-size:36px}
body.land .tip{grid-area:tip;font-size:11px}
body.land .rotbtn{position:absolute;right:calc(34% + 20px);bottom:6px;top:auto;margin:0;z-index:2;font-size:11px;padding:2px 8px}
body.land .tip{padding-right:110px}
body.rot{overflow:hidden}
body.rot .scr{position:fixed;left:0;top:0;width:100vh;height:100vw;min-height:0;transform:rotate(90deg) translateY(-100%);transform-origin:top left;overflow:hidden}
.tip{font-size:13px;color:var(--bn);line-height:1.5}.tip b{font-weight:400;color:var(--br);background:#ffe9a8;padding:0 2px}
.gauge{height:14px;border:2px solid var(--br);background:#fff}
.gauge i{display:block;height:100%;width:0;background:#f76b15}
.stat{display:flex;gap:6px}
.stat div{flex:1;background:#fff;border:2px solid var(--bn);text-align:center;padding:5px 0;font-size:12px;color:var(--bn)}
.stat b{display:block;font-size:20px;font-weight:400;color:var(--br)}
.log{font-size:14px;background:var(--br);color:var(--cr);padding:7px 9px;min-height:36px;line-height:1.4}
.tg2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.res{font-size:44px;text-align:center;color:#c0392b;margin:6px 0}
</style>
</head>
<body>
<div class="scr">
  <div class="hd"><span>오리 레이스</span><span><span id="hdr"></span> <button id="snd" style="font-family:inherit;font-size:12px;background:#fff6d8;color:#3b2412;border:2px solid #2e6b16;border-radius:0;padding:2px 6px;margin-left:6px;cursor:pointer">소리 켬</button></span></div>

  <div class="bd" id="sJoin">

  <div class="bd hidden" id="sDeco">

    <button class="small" id="bRe">이름을 잘못 골랐어요</button>
  </div>

  <div class="bd hidden" id="sRace">
    <button class="rotbtn" id="rot">↻ 가로로 보기</button>
    <div class="rstat" style="display:flex;gap:8px;align-items:center">
      <div style="width:64px;background:#3c9fdc;border:3px solid var(--bn)"><canvas id="mini" width="20" height="16"></canvas></div>
      <div class="stat" style="flex:1"><div>내 순위<b id="rank">-</b></div><div>거리<b id="dist">0m</b></div></div>

    <div class="tip">칠판에 <b>🌟 꽥 타임</b>이 뜨면 꽥! <b>🦊 여우</b>가 뜨면 꾹 참아요!</div>
  </div>

  <div class="bd hidden" id="sDone">
    <div class="h1" id="dt1"></div>
    <div class="res" id="dres"></div>

    <div class="lb" style="text-align:center">선생님이 다시 경기를 시작하면 자동으로 넘어가요.</div>
  </div>

  <div class="bd hidden" id="sMsg">
    <div class="h1" id="mtxt"></div>
    <button class="big" id="bHome">처음으로</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
const firebaseConfig={apiKey:"AIzaSyAySwK7RVdvfStTkGiN7Vb6yxLFUbxLsQo",authDomain:"duck-race-23875.firebaseapp.com",databaseURL:"https://duck-race-23875-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"duck-race-23875",storageBucket:"duck-race-23875.firebasestorage.app",messagingSenderId:"447636809425",appId:"1:447636809425:web:540bc58ef9c3a0fcdc47f0"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database(),auth=firebase.auth();
const $=id=>document.getElementById(id);

function toArr(x){if(!x)return [];if(Array.isArray(x))return x;const a=[];Object.keys(x).forEach(k=>a[+k]=x[k]);return a;}
let cur='sJoin';
function show(id){if(cur===id)return;['sJoin','sPick','sDeco','sRace','sDone','sMsg'].forEach(s=>$(s).classList.toggle('hidden',s!==id));cur=id;if(id!=='sRace')exitLand();applyLand();}
let landFS=false,landRot=false;
function natLand(){return innerWidth>innerHeight&&innerHeight<560;}

 const b=document.getElementById('rot');if(b){b.textContent=(landFS||landRot)?'↺ 세로로 보기':'↻ 가로로 보기';b.style.display=(natLand()&&!landFS&&!landRot)?'none':'';}}
async function enterLand(){try{if(document.documentElement.requestFullscreen&&screen.orientation&&screen.orientation.lock){await document.documentElement.requestFullscreen({navigationUI:'hide'});await screen.orientation.lock('landscape');landFS=true;applyLand();return;}}catch(e){try{if(document.fullscreenElement)await document.exitFullscreen();}catch(_){}}
 landRot=true;applyLand();}

addEventListener('resize',()=>applyLand());document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&landFS){landFS=false;applyLand();}});

/* ---------- 소리 ---------- */
function lsG(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsS(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let AC=null,MG=null,BG=null,SG=null,NB=null,soundOn=(lsG('duckrace_sound')!=='0'),bgmVol=+(lsG('duckrace_bgmvol')||0.5);
function initAudio(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=soundOn?1:0;MG.connect(AC.destination);BG=AC.createGain();BG.gain.value=bgmVol*0.5;BG.connect(MG);SG=AC.createGain();SG.gain.value=0.6;SG.connect(MG);const len=AC.sampleRate;NB=AC.createBuffer(1,len,AC.sampleRate);const dd=NB.getChannelData(0);for(let i=0;i<len;i++)dd[i]=Math.random()*2-1;}if(AC.state==='suspended')AC.resume();}catch(e){}}
document.addEventListener('pointerdown',initAudio);document.addEventListener('keydown',initAudio);
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,dur,type,vol,at,f2,dest){if(!AC)return;const t0=at||AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(dest||SG);o.start(t0);o.stop(t0+dur+0.02);}

const sfxLast={};
function sfx(n){if(!AC||!soundOn)return;const T=AC.currentTime;if(sfxLast[n]&&T-sfxLast[n]<0.15)return;sfxLast[n]=T;
 switch(n){
 case 'plop':tone(700,0.14,'sine',0.35,T,180);noise(0.12,0.15,T+0.05,1800,600);break;
 case 'ready':tone(880,0.08,'square',0.12,T);tone(1320,0.12,'square',0.12,T+0.08);break;
 case 'blip':tone(990,0.06,'square',0.1,T);break;

 case 'vortex':for(let k=0;k<3;k++)tone(400,0.09,'triangle',0.25,T+k*0.09,900);break;
 case 'rapid':noise(0.35,0.3,T,400,3000);break;
 case 'bread':tone(520,0.07,'square',0.15,T);tone(700,0.09,'square',0.15,T+0.09);break;
 case 'nap':tone(330,0.3,'triangle',0.2,T,260);tone(300,0.3,'triangle',0.15,T+0.32,240);break;
 case 'rev':tone(320,0.12,'sine',0.3,T,150);tone(150,0.12,'sine',0.3,T+0.12,320);break;
 case 'turtle':tone(200,0.08,'square',0.12,T);tone(260,0.08,'square',0.12,T+0.12);tone(330,0.1,'square',0.12,T+0.24);break;
 case 'carp':noise(0.25,0.35,T,900,300,null,'lowpass');tone(300,0.2,'sine',0.25,T,90);break;
 case 'swap':tone(400,0.12,'square',0.15,T,1100);break;
 case 'heart':[1046,1318,1568].forEach((f,k)=>tone(f,0.09,'triangle',0.18,T+k*0.06));break;
 case 'goal':tone(1046,0.15,'square',0.18,T);tone(784,0.3,'square',0.18,T+0.15);break;
 case 'goal2':tone(880,0.08,'triangle',0.15,T);break;
 case 'boom':noise(0.6,0.4,T,600,120,null,'lowpass');for(let k=0;k<5;k++)noise(0.04,0.12,T+0.15+k*0.07+Math.random()*0.05,4000);break;
 case 'balloon':tone(500,0.35,'triangle',0.18,T,1100);tone(1200,0.06,'square',0.08,T+0.35);break;
 case 'hook':for(let k=0;k<5;k++)tone(900,0.03,'square',0.08,T+k*0.06);tone(700,0.15,'sine',0.3,T+0.4,180);break;
 case 'banana':tone(1200,0.45,'sine',0.18,T,300);break;
 case 'train':for(let k=0;k<4;k++)noise(0.08,0.18,T+k*0.14,500,null,null,'lowpass');tone(880,0.25,'square',0.08,T+0.6);tone(740,0.25,'square',0.08,T+0.6);break;
 case 'swan':tone(420,0.12,'square',0.14,T,380);tone(420,0.16,'square',0.14,T+0.16,360);break;

/* ---------- 오리 그림 ---------- */
function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h);}
const SP=["......kkkk...",".....kHHHHk..",".....kHHeHkkk",".....kHHHHbbk","kk...kHHHkkk.","kBk.kkBBBBk..","kBBkBBBBDDBk.","kBBBBBBDDDBk.",".kBBBBBBBBk..","..kkkkkkkk..."];

const ACC=['none','straw','crown','ribbon','glasses','leaf','band','chef','bow','phones','wizard','cap','pirate','flower','bunny','cat','party','scarf','heartgl'];

function duck(c,x,y,pal,acc){const p=PAL[pal]||PAL[0];
 SP.forEach((row,ry)=>{for(let rx=0;rx<13;rx++){const ch=row[rx];if(ch==='.')continue;R(c,x+rx,y+ry,1,1,ch==='k'?'#3b2412':ch==='H'?p[0]:ch==='B'?p[1]:ch==='D'?p[2]:ch==='b'?p[3]:'#111');}});
 const A=(dx,dy,w,h,col)=>R(c,x+dx,y+dy,w,h,col);if(pal===2)A(4,4,1,1,'#fff');
 switch(ACC[acc]){case 'straw':A(3,0,9,1,'#3b2412');A(4,-1,7,1,'#e8bf5a');A(5,-3,5,2,'#e8bf5a');A(5,-2,5,1,'#c0392b');A(5,-4,5,1,'#3b2412');break;
 case 'crown':A(6,-2,5,2,'#ffd400');A(6,-3,1,1,'#ffd400');A(8,-3,1,1,'#ffd400');A(10,-3,1,1,'#ffd400');A(8,-2,1,1,'#e5484d');break;
 case 'ribbon':A(5,-1,2,2,'#e5484d');A(4,0,1,1,'#e5484d');A(7,0,1,1,'#e5484d');break;
 case 'glasses':A(7,2,4,1,'#111');A(7,3,1,1,'#111');A(9,3,2,1,'#111');break;

 case 'band':A(5,1,6,1,'#3e63dd');A(4,1,1,2,'#3e63dd');break;
 case 'chef':A(6,-4,5,4,'#3b2412');A(7,-4,3,3,'#fff');A(6,-1,5,1,'#e6e6e6');break;
 case 'phones':A(5,-1,6,1,'#3b2412');A(4,0,2,3,'#3b2412');A(4,1,1,1,'#e5484d');A(10,0,2,2,'#3b2412');A(10,0,1,1,'#e5484d');break;
 case 'wizard':A(5,0,7,1,'#3b2412');A(6,-1,4,1,'#8e4ec6');A(7,-2,3,1,'#8e4ec6');A(7,-3,2,1,'#8e4ec6');A(8,-4,1,1,'#8e4ec6');A(7,-1,1,1,'#ffe14d');A(8,-3,1,1,'#ffe14d');break;
 case 'cap':A(5,-1,5,2,'#3e63dd');A(6,-2,3,1,'#3e63dd');A(10,0,3,1,'#2b4fb8');A(7,-1,1,1,'#ffffff');break;
 case 'pirate':A(5,0,6,1,'#e5484d');A(6,-1,4,1,'#e5484d');A(7,0,1,1,'#ffffff');A(9,-1,1,1,'#ffffff');A(3,1,3,1,'#e5484d');A(4,2,1,1,'#e5484d');break;
 case 'flower':A(6,-2,3,3,'#3b2412');A(7,-3,1,1,'#ff9ec7');A(6,-2,1,1,'#ff9ec7');A(8,-2,1,1,'#ff9ec7');A(7,-1,1,1,'#ff9ec7');A(7,-2,1,1,'#ffe14d');break;
 case 'bunny':A(5,-5,3,5,'#3b2412');A(6,-4,1,4,'#ffb8d6');A(8,-5,3,5,'#3b2412');A(9,-4,1,4,'#ffb8d6');break;
 case 'cat':A(5,-2,2,2,'#3b2412');A(5,-3,1,1,'#3b2412');A(9,-2,2,2,'#3b2412');A(10,-3,1,1,'#3b2412');A(6,-1,1,1,'#ff9ec7');A(9,-1,1,1,'#ff9ec7');break;
 case 'party':A(6,-1,4,1,'#3e63dd');A(7,-2,3,1,'#ffe14d');A(7,-3,2,1,'#3e63dd');A(7,-4,2,1,'#ffe14d');A(7,-5,2,1,'#e5484d');break;
 case 'scarf':A(5,4,6,2,'#e5484d');A(6,4,1,2,'#fff6d8');A(9,4,1,2,'#fff6d8');A(5,6,2,2,'#e5484d');break;
 case 'heartgl':A(7,2,2,2,'#ff5c8a');A(10,2,2,2,'#ff5c8a');A(9,2,1,1,'#3b2412');A(8,2,1,1,'#ffc2d6');break;
 case 'bow':A(2,5,3,2,'#8e4ec6');A(1,5,1,1,'#8e4ec6');break;}}

/* ---------- 접속 ---------- */
const ITM=[['🚀','부스터','경기 중간에 한 번 쭉 빨라져요'],['🛡️','방패','나쁜 일을 한 번 막아 줘요'],['🍀','행운','나쁜 일을 가끔 피해요'],['🐢','거북 친구','뒤처지면 거북이가 한 번 태워 줘요']];
let uid=null,code=null,roomRef=null,room=null,names=[],nums=[],me=-1,myLook={pal:0,acc:1,ready:false,item:null};
const q=new URLSearchParams(location.search).get('room');if(q)$('code').value=q.replace(/\D/g,'').slice(0,4);
auth.onAuthStateChanged(u=>{if(u){uid=u.uid;if($('jerr').textContent.indexOf('연결')>=0)$('jerr').textContent='';if(q&&!code)join();}});
auth.signInAnonymously().catch(e=>{$('jerr').textContent='서버에 연결하지 못했어요. 선생님께 알려 주세요.';});
$('bJoin').onclick=join;$('code').addEventListener('keydown',e=>{if(e.key==='Enter')join();});
async function join(){const c=$('code').value.replace(/\D/g,'');if(c.length!==4){$('jerr').textContent='네 자리 숫자를 입력해 주세요';return;}
 if(!uid){$('jerr').textContent='연결하는 중이에요. 잠시 뒤 다시 눌러 주세요';return;}
 try{const s=await db.ref('rooms/'+c+'/host').once('value');if(!s.exists()){$('jerr').textContent='그런 방이 없어요. 번호를 다시 확인해 주세요';return;}}
 catch(e){$('jerr').textContent='방에 들어가지 못했어요';return;}
 if(roomRef)roomRef.off();code=c;$('hdr').textContent='방 '+c;roomRef=db.ref('rooms/'+c);roomRef.on('value',onRoom);}
$('bHome').onclick=()=>{if(roomRef)roomRef.off();roomRef=null;code=null;me=-1;names=[];$('hdr').textContent='';$('jerr').textContent='';show('sJoin');};

function onRoom(s){const v=s.val();
 if(!v){show('sMsg');$('mtxt').textContent='선생님이 방을 닫았어요. 다음 경기에서 만나요!';return;}
 room=v;if(v.names)names=toArr(v.names);if(v.nums)nums=toArr(v.nums);
 const cl=v.claims||{};
 if(me<0){for(const k in cl)if(cl[k]===uid)me=+k;}
 else if(cl[me]!==uid&&v.status!=='done')me=-1;
 if(v.status==='done'){if(me>=0)showDone(v);else{show('sMsg');$('mtxt').textContent='경기가 끝났어요. 다음 경기에서 만나요!';}return;}
 if(me<0){renderPick(cl);show('sPick');return;}
 const lk=toArr(v.looks)[me];if(lk)myLook={pal:lk.pal|0,acc:lk.acc|0,ready:!!lk.ready,item:lk.item!=null?lk.item|0:myLook.item};
 if(v.status==='lobby'){if(cur!=='sDeco'){show('sDeco');buildDeco();}syncDeco();}
 else if(v.status==='racing'){if(cur!=='sRace'){show('sRace');initRace();}updRace(v.state||{});}}

/* ---------- 이름 고르기 ---------- */
function lbl(i){const n=names[i]||'';return /^\d+번$/.test(n)?n:(nums[i]||i+1)+'번 '+n;}
function renderPick(cl){$('nm').innerHTML=names.map((n,i)=>{const tk=cl[i]&&cl[i]!==uid;return '<button data-i="'+i+'" class="'+(tk?'tk':'')+'">'+esc(lbl(i))+(tk?'<br><small>선택됨</small>':'')+'</button>';}).join('');
 $('nm').querySelectorAll('button').forEach(b=>b.onclick=()=>pick(+b.dataset.i,b.classList.contains('tk')));}
async function pick(i,tk){if(tk){$('perr').textContent='이미 다른 친구가 골랐어요';return;}
 if(!confirm(lbl(i)+' 맞나요?'))return;
 try{const r=await db.ref('rooms/'+code+'/claims/'+i).transaction(c=>c===null?uid:undefined);
  if(r.snapshot.val()===uid){me=i;sfx('plop');room.claims=room.claims||{};room.claims[i]=uid;$('perr').textContent='';onRoom({val:()=>room});}else $('perr').textContent='이미 다른 친구가 골랐어요';}
 catch(e){$('perr').textContent='고르지 못했어요. 다시 눌러 주세요';}}

/* ---------- 꾸미기 ---------- */
const pv=$('pv').getContext('2d'),mn=$('mini').getContext('2d');
function buildDeco(){$('dname').textContent=lbl(me)+'의 오리';
 $('sw').innerHTML='';PAL.forEach((p,i)=>{const b=document.createElement('button');b.style.background=p[1];b.setAttribute('aria-label','몸 색 '+(i+1));b.onclick=()=>{myLook.pal=i;sfx('blip');saveLook();};$('sw').appendChild(b);});
 $('ac').innerHTML='';ACN.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{myLook.acc=i;sfx('blip');saveLook();};$('ac').appendChild(b);});
 $('it').innerHTML='';ITM.forEach((m,i)=>{const b=document.createElement('button');b.innerHTML='<i>'+m[0]+'</i>'+m[1];b.onclick=()=>{myLook.item=i;sfx('blip');saveLook();};$('it').appendChild(b);});}
function syncDeco(){$('sw').querySelectorAll('button').forEach((b,j)=>b.className=j===myLook.pal?'on':'');$('ac').querySelectorAll('button').forEach((b,j)=>b.className=j===myLook.acc?'on':'');$('it').querySelectorAll('button').forEach((b,j)=>b.className=j===myLook.item?'on':'');$('itd').textContent=myLook.item!=null?ITM[myLook.item][0]+' '+ITM[myLook.item][2]:'아이템을 하나 골라요';
 $('bReady').textContent=myLook.ready?'다시 꾸미기':'준비 완료';$('bReady').className=myLook.ready?'big off':'big';
 $('rlog').textContent=myLook.ready?'준비 완료! 선생님이 출발을 누를 때까지 기다려요.':(myLook.item==null?'모양과 아이템을 고르고 준비 완료를 눌러요.':'마음에 드는 모양을 고르고 준비 완료를 눌러요.');}
function saveLook(){syncDeco();if(me<0)return;db.ref('rooms/'+code+'/looks/'+me).set({pal:myLook.pal,acc:myLook.acc,ready:myLook.ready,item:myLook.item}).catch(()=>{});}
$('bReady').onclick=()=>{if(!myLook.ready&&myLook.item==null){$('rlog').textContent='아이템을 먼저 하나 골라 주세요!';sfx('oops');return;}myLook.ready=!myLook.ready;if(myLook.ready)sfx('ready');saveLook();};
$('bRe').onclick=async()=>{if(!confirm('이름을 다시 고를까요?'))return;const i=me;myLook.ready=false;
 try{await db.ref('rooms/'+code+'/looks/'+i).set({pal:myLook.pal,acc:myLook.acc,ready:false,item:myLook.item});await db.ref('rooms/'+code+'/claims/'+i).remove();}catch(e){}
 if(room&&room.claims)delete room.claims[i];me=-1;onRoom({val:()=>room});};

/* ---------- 경기 ---------- */
const EVT=['다시 힘차게 헤엄치는 중','소용돌이에 빠졌어요! 빙글빙글','급류를 탔어요! 슝-','빵 조각을 먹었어요! 부스터 ON','갑자기 낮잠을 자요... zzz','방향을 착각해 거꾸로 가요!','거북이 택시를 탔어요!','잉어가 튀어올라 깜짝 놀랐어요!','휙! 앞 친구와 자리를 바꿨어요!','풍선에 매달려 둥실 날아가요!','낚싯바늘에 걸렸어요! 뒤로 퐁당','바나나 껍질에 미끄러져 쭉!','오리 기차에 탔어요! 칙칙폭폭','백조 택시를 탔어요!','먹구름 아래에서 비를 맞아요','무지개! 신나게 헤엄쳐요','개구리가 머리 위로 폴짝!','폭포에서 풍덩 떨어졌어요!','독수리 그림자에 깜짝 놀랐어요!','🦊 여우를 보고 깜짝! 잠깐 멈췄어요','🚀 부스터 점화! 슝-'];
const ZNN=['단풍 마을','황금 논밭','연꽃 호수','대나무 숲','폭포 계곡','강변 축제'],ZFR=[0,.16,.32,.5,.66,.84,1],ZCL=['#e4c27c','#e8c547','#f4b6c8','#8fd06a','#a9b6c2','#f2a0a0'];
const rLen=()=>(room&&room.len)||200;
let S={},lastS=-1,lastK=0,bcd=0,evT=0,qcd=0,qaSeen={};
function initRace(){lastS=-1;bcd=0;S={};qcd=0;qaSeen={};
 lastK=room&&room.state&&room.state.k?room.state.k[2]:0;
 $('ev').textContent='곧 출발해요! 칠판에 꽥 타임이 뜨면 꽥을 눌러요.';updItem();}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function updItem(){const it=toArr(S.it)[me],u=toArr(S.iu)[me];const k=(it!=null&&it>=0)?it:myLook.item;$('myit').textContent=k!=null?'내 아이템: '+ITM[k][0]+' '+ITM[k][1]+(u?' · 썼어요!':' · '+ITM[k][2]):'';}
function evMsg(m){$('ev').textContent=m;evT=performance.now();}
function updRace(s){S=s;const p=toArr(s.p),r=toArr(s.r),sc=toArr(s.s);if(!p.length)return;
 const ord=p.map((x,i)=>i).sort((a,b)=>{const ra=r[a]||0,rb=r[b]||0;if(ra&&rb)return ra-rb;if(ra)return -1;if(rb)return 1;return p[b]-p[a];});
 $('rank').textContent=(ord.indexOf(me)+1)+'등';$('dist').textContent=Math.round((p[me]||0)*rLen())+'m';$('hdr').textContent=ZNN[s.z|0]||'';
 const my=sc[me]|0;
 if(r[me]){if(lastS!==99){lastS=99;sfx('goal');evMsg('골인! '+r[me]+'번째로 들어왔어요');}}
 else if(my!==lastS){if(my||lastS>0)evMsg(EVT[my]);if(my)sfx([0,'vortex','rapid','bread','nap','rev','turtle','carp','swap','balloon','hook','banana','train','swan','rain','rainbow','frog','fall','scared','scared','rapid'][my]);lastS=my;}
 updItem();
 if(s.qa){const id=s.qa[0],ok=toArr(s.qa[3]),bad=toArr(s.qa[4]);if(ok.indexOf(me)>=0&&!qaSeen[id+'o']){qaSeen[id+'o']=1;evMsg('🌟 꽥 타임 성공! 쭉쭉 빨라져요');sfx('qok');vib([60,40,60]);}
  if(bad.indexOf(me)>=0&&!qaSeen[id+'b']){qaSeen[id+'b']=1;evMsg('🦊 여우한테 놀랐어요! 다음엔 꾹 참아요');sfx('oops');vib(250);}}
 toArr(s.h).forEach(h=>{if(h&&h[0]===me&&h[1]!==me){evMsg((names[h[1]]||'친구')+'이(가) 내 오리를 응원했어요!');sfx('heart');}});
 if(s.k&&s.k[2]!==lastK){lastK=s.k[2];const e=s.k[0],th=s.k[1];if(th===me&&e!==me)sfx('bread');if(th===me&&e!==me)evMsg('내 빵 조각을 '+(names[e]||'친구')+' 오리가 먹었어요!');}}
document.addEventListener('keydown',e=>{if(cur!=='sRace'||e.repeat)return;if(e.key===' '||e.key==='Enter'){e.preventDefault();quack();}});
function quack(){if(me<0||qcd>0)return;qcd=0.35;sfx('quack');vib(20);const b=$('qk');b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),120);db.ref('rooms/'+code+'/quacks').push({from:me,uid}).catch(()=>{});}
$('qk').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();quack();});$('qk').addEventListener('contextmenu',e=>e.preventDefault());
$('rot').onclick=()=>{initAudio();(landFS||landRot)?exitLand():enterLand();};
const map=$('map'),mc=map.getContext('2d');
map.onclick=e=>{if(me<0)return;if(bcd>0){evMsg('빵 조각은 '+Math.ceil(bcd)+'초 뒤에 다시 던질 수 있어요');return;}
 const px=e.offsetX/map.clientWidth*160,py=e.offsetY/map.clientHeight*36;
 if(py<6||py>30){evMsg('강 위를 눌러 주세요');return;}
 const p=Math.max(0,Math.min(1,(px-4)/150)),y=Math.max(0,Math.min(1,(py-7)/20));bcd=8;
 db.ref('rooms/'+code+'/breads').push({p,y,from:me,uid}).catch(()=>{});sfx('toss');
 evMsg(Math.round(p*rLen())+'m 지점에 빵 조각을 던졌어요! 누가 먹을까요?');};
function drawMap(){const p=toArr(S.p),n=Math.max(2,p.length||names.length);
 R(mc,0,0,160,36,'#7cc04a');R(mc,0,6,160,24,'#3c9fdc');R(mc,0,6,160,1,'#62bdeb');R(mc,0,29,160,1,'#62bdeb');
 for(let i=0;i<6;i++){const a=4+ZFR[i]*150,b=4+ZFR[i+1]*150;R(mc,a,1,b-a,4,ZCL[i]);}
 for(let r=0;r<12;r++)R(mc,154,6+r*2,2,1,r%2?'#fff':'#3b2412');
 if(S.cb!=null){mc.globalAlpha=0.45;R(mc,4,7+S.cb*20-3,150,6,'#ffffff');mc.globalAlpha=1;}
 if(S.cl){const a=4+S.cl[0]*150,b=4+S.cl[1]*150;mc.globalAlpha=0.45;R(mc,a,S.cl[2]?17:7,b-a,10,'#1d2b3a');mc.globalAlpha=1;}
 toArr(S.vs).forEach(v=>{if(!v)return;const x=4+v[0]*150,y=7+v[1]*20;if(v[2]){R(mc,x-2,y-1,5,3,'#ffffff');R(mc,x-1,y,3,1,'#2f86c4');}else if(Math.floor(performance.now()/160)%2){R(mc,x-2,y-1,5,3,'#ffe14d');}});
 toArr(S.b).forEach(b=>{if(!b)return;const x=4+b[0]*150,y=7+b[1]*20;R(mc,x-1,y-1,4,3,b[2]===me?'#e5484d':'#3b2412');R(mc,x,y,2,1,'#f0c27a');});
 const yy=toArr(S.y),yf=i=>(yy[i]!=null?yy[i]:i/(n-1));p.forEach((v,i)=>{if(i===me)return;R(mc,4+v*150,7+yf(i)*20,2,2,'#fff6d8');});
 if(me>=0){const x=4+(p[me]||0)*150,y=7+yf(me)*20;R(mc,x-2,y-2,6,6,'#3b2412');R(mc,x-1,y-1,4,4,(PAL[myLook.pal]||PAL[0])[1]);R(mc,x-1,y-5,4,2,'#e5484d');}}

/* ---------- 결과 ---------- */
function showDone(v){show('sDone');const o=toArr(v.result),rk=o.indexOf(me)+1,m=v.mode||'all';
 if(m==='first'){$('dt1').textContent='오늘의 1등';$('dres').textContent=names[o[0]]||'';}
 else if(m==='last'){$('dt1').textContent='오늘의 꼴등';$('dres').textContent=names[o[o.length-1]]||'';}
 else{$('dt1').textContent='나의 순위';$('dres').textContent=rk?rk+'등':'-';}
 $('dt2').textContent=rk?(names[me]||'내')+' 오리는 '+o.length+'마리 중 '+rk+'등으로 들어왔어요!':'';}

/* ---------- 반복 ---------- */
let last=performance.now(),ut=0;
function loop(n){const dt=Math.min(0.05,(n-last)/1000);last=n;const tt=n/1000;
 if(cur==='sDeco'){pv.clearRect(0,0,40,22);R(pv,0,0,40,22,'#3c9fdc');for(let k=0;k<8;k++)R(pv,(k*11+tt*6)%40,3+k*2.3,3,1,'#7fcdf2');const b=Math.sin(tt*4)>0?0:1;duck(pv,13,7+b,myLook.pal,myLook.acc);R(pv,12,17+b,15,1,'#a8e0f7');}
 if(cur==='sRace'){bcd=Math.max(0,bcd-dt);qcd=Math.max(0,qcd-dt);
  const b=Math.sin(tt*4)>0?0:1;mn.clearRect(0,0,20,16);R(mn,0,0,20,16,'#3c9fdc');duck(mn,3,4+b,myLook.pal,myLook.acc);R(mn,2,14,15,1,'#a8e0f7');drawMap();
  ut+=dt;if(ut>0.15){ut=0;$('bc').textContent=bcd>0?Math.ceil(bcd)+'초 뒤':'준비됨';}}
 requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
