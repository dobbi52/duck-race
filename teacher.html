<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오리 레이스 - 선생님</title>
<link href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" rel="stylesheet">
<style>
:root{--br:#3b2412;--bn:#6b4423;--cr:#fff6d8;--gr:#5aa832;--gd:#2e6b16;--u:2px}
*{box-sizing:border-box}
body{margin:0;background:#2b1d10;font-family:'Galmuri11','Galmuri9',sans-serif;color:var(--br)}
button,input,select,textarea{font-family:inherit}
.btn{font-size:15px;background:#fff;color:var(--br);border:3px solid var(--bn);padding:6px 14px;cursor:pointer;border-radius:0}
.btn.on{background:var(--bn);color:var(--cr)}
.btn.go{background:var(--gr);border-color:var(--gd);color:#fff}
.btn.red{background:#e5484d;border-color:#7a1f1f;color:#fff}
.hidden{display:none!important}
#setup{max-width:760px;margin:30px auto;padding:0 16px}
.card{background:var(--cr);border:4px solid var(--bn);padding:18px}
.title{background:var(--gr);border:4px solid var(--gd);color:#ffe14d;font-size:26px;padding:10px 16px;margin-bottom:12px;text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.lb{font-size:14px;color:var(--bn);min-width:70px}
select,input[type=text]{font-size:15px;padding:6px;border:3px solid var(--bn);background:#fff;color:var(--br);border-radius:0}
textarea{width:100%;height:260px;font-size:15px;padding:8px;border:3px solid var(--bn);background:#fff;color:var(--br);resize:vertical;border-radius:0}
.note{font-size:13px;color:var(--bn);margin-top:6px;line-height:1.6}
.err{color:#c0392b;font-size:14px;min-height:20px;margin-top:8px}
#game{padding:8px}
.wrap{width:min(100%,calc((100vh - 250px) * 1.6));min-width:min(100%,640px);margin:0 auto}
.top{display:flex;gap:6px;background:var(--gr);border:3px solid var(--gd);padding:5px;align-items:center;flex-wrap:wrap}
.chip{background:var(--cr);border:2px solid var(--gd);padding:4px 10px;font-size:15px}
.chip.g{background:#3e8f22;color:#ffe14d;border-color:#1f4d0e}
.top .btn{font-size:13px;padding:3px 10px;border-width:2px}
#stage{position:relative;border:3px solid var(--gd);border-top:0;overflow:hidden;background:#3c9fdc}
#stage canvas{display:block;width:100%;image-rendering:pixelated}
#mmw{border:3px solid var(--gd);border-top:0;background:var(--gr)}
#mmw canvas{display:block;width:100%;image-rendering:pixelated}
.tg{position:absolute;transform:translate(-100%,-50%);font-size:calc(var(--u)*4.2);line-height:1;background:var(--br);color:var(--cr);padding:1px 2px;pointer-events:none}
.bb{position:absolute;transform:translate(-25%,-120%);font-size:calc(var(--u)*4.4);line-height:1.1;background:var(--cr);border:2px solid var(--bn);padding:1px 4px;white-space:nowrap;display:none;z-index:3;pointer-events:none}
.msg{position:absolute;left:2%;right:2%;bottom:3%;background:var(--cr);border:3px solid var(--bn);padding:.4em .8em;font-size:calc(var(--u)*7);display:none;z-index:5}
.msg.cd{left:40%;right:40%;bottom:40%;text-align:center;font-size:calc(var(--u)*24)}
.zone{position:absolute;right:1.5%;top:2%;background:var(--cr);border:2px solid var(--bn);font-size:calc(var(--u)*5);padding:2px 8px;z-index:5}
.behind{position:absolute;left:1%;top:50%;transform:translateY(-50%);background:var(--bn);color:var(--cr);font-size:calc(var(--u)*5);padding:3px 8px;z-index:5;display:none}
#lobby{position:absolute;right:3%;top:9%;width:50%;background:var(--cr);border:4px solid var(--bn);padding:2%;z-index:6;text-align:center}
#lobby .t1{font-size:calc(var(--u)*5.5);color:var(--bn)}
#lobby .code{font-size:calc(var(--u)*20);letter-spacing:.12em;color:var(--br);line-height:1.2}
#lobby .url{font-size:calc(var(--u)*4.4);word-break:break-all;color:var(--bn)}
#qr{display:inline-block;background:#fff;padding:6px;margin:4px 0;border:2px solid var(--bn)}
#qr img,#qr canvas{display:block;width:calc(var(--u)*44)!important;height:calc(var(--u)*44)!important;image-rendering:pixelated}
#lobby .cnt{font-size:calc(var(--u)*6.5);margin-top:4px}
#result{position:absolute;left:8%;right:8%;top:8%;background:var(--cr);border:4px solid var(--bn);padding:2%;z-index:7;text-align:center;max-height:84%;overflow:auto}
#result h2{margin:0 0 .3em;font-weight:400;font-size:calc(var(--u)*9)}
#result .big{font-size:calc(var(--u)*16);color:#c0392b;margin:.2em 0}
#result .list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px 10px;font-size:calc(var(--u)*5);text-align:left}
#result .list b{display:inline-block;min-width:1.6em;font-weight:400;background:var(--bn);color:var(--cr);text-align:center;margin-right:4px}
.panel{background:var(--cr);border:3px solid var(--bn);margin-top:8px;padding:8px 10px}
.rk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px 8px;font-size:14px}
.rk b{display:inline-block;min-width:26px;font-weight:400;background:var(--bn);color:var(--cr);text-align:center;margin-right:5px}
.rk .f b{background:#e0a800;color:var(--br)}
.rk .off{color:#a89a80}.rk .off b{background:#b9ab8c}
.rk .rd b{background:var(--gr)}
.ctl{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.ctl .btn{font-size:13px;padding:4px 10px;border-width:2px}
.ctl .sp{flex:1}
.legend{font-size:12px;color:var(--bn)}
.ab{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-bottom:6px}
.ab button{font-size:15px;padding:7px 2px;background:#f6c97a;color:var(--br);border:3px solid var(--bn);border-radius:0;cursor:pointer}
.ab button.out{background:#e2d7bf;color:#a89a80;border-color:#b9ab8c;text-decoration:line-through}
.cnum{font-size:24px;min-width:72px;text-align:center}
</style>
</head>
<body>

<div id="setup">
  <div class="title">오리 레이스</div>
  <div class="card">
    <div class="row"><span class="lb">뽑기 방식</span><button class="btn pm" data-p="num">번호로</button><button class="btn pm" data-p="name">이름으로</button></div>
    <div class="row" id="numBox"><span class="lb">우리 반 인원</span><button class="btn" id="cMinus">−</button><span class="cnum" id="cnum">25명</span><button class="btn" id="cPlus">+</button><span class="note" style="margin:0">최대 40명</span></div>
    <div id="nameBox">
    <div class="row"><span class="lb">반 선택</span><select id="cls"></select><button class="btn" id="del">이 반 지우기</button></div>
    <div class="row"><span class="lb">반 이름</span><input type="text" id="cname" placeholder="6학년 2반" style="flex:1"><button class="btn" id="save">명단 저장</button></div>
    <div class="row" style="justify-content:space-between"><span class="lb">명단 (한 줄에 한 명)</span><span class="lb" id="ncount" style="text-align:right">0명</span></div>
    <textarea id="names" placeholder="김하늘&#10;이도윤&#10;박서연"></textarea>
    </div>
    <div class="row" style="margin-top:12px"><span class="lb">오늘 빠지는 친구</span><span class="note" style="margin:0" id="absNote"></span></div>
    <div class="ab" id="ab"></div>
    <div class="row" style="margin-top:10px"><span class="lb">결과 방식</span>
      <button class="btn mb on" data-m="all">전체 순위</button><button class="btn mb" data-m="first">1등만</button><button class="btn mb" data-m="last">꼴등만</button></div>
    <div class="row" style="margin-top:14px"><button class="btn go" id="mk" style="font-size:18px;padding:10px 24px">방 만들기</button></div>
    <div class="err" id="err"></div>
    <div class="note">명단과 학생들이 꾸민 오리 모양은 이 컴퓨터에만 저장돼요. 서버에 올라간 이름은 경기가 끝나면 지워지고, 이 창을 닫으면 방 전체가 지워져요.</div>
  </div>
</div>

<div id="game" class="hidden">
  <div class="wrap">
    <div class="top">
      <span class="chip g" id="gcls">우리 반</span><span class="chip g">방 <span id="gcode">----</span></span>
      <span class="chip" id="lead">선두: -</span><span class="chip" id="prog">0m / 200m</span>
      <span style="flex:1"></span><button class="btn" id="fs">전체 화면</button>
    </div>
    <div id="stage">
      <canvas id="cv" width="320" height="200"></canvas>
      <div class="zone" id="zone">단풍 마을</div>
      <div class="behind" id="behind"></div>
      <div class="msg" id="msg"></div>
      <div id="lobby">
        <div class="t1">폰이나 크롬북으로 접속해요</div>
        <div class="code" id="lcode">----</div>
        <div id="qr"></div>
        <div class="url" id="lurl"></div>
        <div class="cnt" id="lcnt">접속 0 · 준비 0</div>
      </div>
      <div id="result" class="hidden"><h2 id="rtitle"></h2><div id="rbody"></div></div>
    </div>
    <div id="mmw"><canvas id="mm" width="320" height="18"></canvas></div>
    <div class="panel">
      <div class="rk" id="rk"></div>
      <div class="ctl">
        <button class="btn gb" data-m="all">전체 순위</button><button class="btn gb" data-m="first">1등만</button><button class="btn gb" data-m="last">꼴등만</button>
        <span class="legend" id="legend"></span><span class="sp"></span>
        <button class="btn go" id="bStart">출발!</button>
        <button class="btn go hidden" id="bAgain">다시 경기</button>
        <button class="btn red" id="bClose">방 닫기</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAySwK7RVdvfStTkGiN7Vb6yxLFUbxLsQo",authDomain:"duck-race-23875.firebaseapp.com",databaseURL:"https://duck-race-23875-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"duck-race-23875",storageBucket:"duck-race-23875.firebasestorage.app",messagingSenderId:"447636809425",appId:"1:447636809425:web:540bc58ef9c3a0fcdc47f0"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database(),auth=firebase.auth();
const $=id=>document.getElementById(id);
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function err(m){$('err').textContent=m;}

let uid=null;
let code=null,roomRef=null,names=[],nums=[],N=0,looks=[],claims={},phase='setup',clsName='',resultOrder=[];
auth.onAuthStateChanged(u=>{if(u){uid=u.uid;if($('err').textContent.indexOf('연결')>=0)err('');const old=lsGet('duckrace_lastroom');if(old){db.ref('rooms/'+old).remove().catch(()=>{});lsSet('duckrace_lastroom','');}}});
auth.signInAnonymously().catch(e=>{err((e.code==='auth/operation-not-allowed'||e.code==='auth/admin-restricted-operation')?'Firebase에서 익명 로그인이 꺼져 있어요. Authentication → 로그인 방법 → 익명을 켜 주세요.':'서버에 연결하지 못했어요: '+e.message);});

/* ---------- 반 명단 ---------- */
const LS='duckrace_classes_v1';
let classes={};try{classes=JSON.parse(lsGet(LS))||{}}catch(e){classes={}}
function saveClasses(){lsSet(LS,JSON.stringify(classes));}
function fillSel(pick){const s=$('cls');s.innerHTML='<option value="">+ 새 반 만들기</option>'+Object.keys(classes).map(k=>'<option value="'+esc(k)+'">'+esc(k)+'</option>').join('');s.value=(pick&&classes[pick])?pick:'';}
function loadClass(k){$('cname').value=k||'';$('names').value=k&&classes[k]?classes[k].names.join('\n'):'';cnt();}
function parseNames(){return $('names').value.split('\n').map(s=>s.trim()).filter(Boolean);}
function cnt(){$('ncount').textContent=parseNames().length+'명';renderAbs();}
let pickMode=lsGet('duckrace_pick')||'num',count=Math.min(40,Math.max(2,+(lsGet('duckrace_count')||25))),absent=new Set();
function fullList(){return pickMode==='num'?Array.from({length:count},(_,i)=>(i+1)+'번'):parseNames();}
function renderAbs(){const l=fullList();let n=0;$('ab').innerHTML=l.map((x,i)=>{const o=absent.has(x);if(!o)n++;return '<button data-k="'+esc(x)+'" class="'+(o?'out':'')+'">'+esc(pickMode==='num'?String(i+1):x)+'</button>';}).join('');
 $('ab').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;absent.has(k)?absent.delete(k):absent.add(k);renderAbs();});
 $('absNote').textContent='누르면 이번 경기에서 빠져요. 참가 '+n+'명';}
function setPick(m){pickMode=m;lsSet('duckrace_pick',m);document.querySelectorAll('.pm').forEach(b=>b.classList.toggle('on',b.dataset.p===m));$('numBox').classList.toggle('hidden',m!=='num');$('nameBox').classList.toggle('hidden',m!=='name');renderAbs();}
document.querySelectorAll('.pm').forEach(b=>b.onclick=()=>setPick(b.dataset.p));
function setCount(c){count=Math.min(40,Math.max(2,c));lsSet('duckrace_count',count);$('cnum').textContent=count+'명';renderAbs();}
$('cMinus').onclick=()=>setCount(count-1);$('cPlus').onclick=()=>setCount(count+1);
function buildList(){const sel=fullList().map((n,i)=>({n,num:i+1})).filter(x=>!absent.has(x.n));return sel;}
$('names').oninput=cnt;
$('cls').onchange=()=>{const k=$('cls').value;loadClass(k);lsSet('duckrace_lastclass',k);};
$('save').onclick=()=>{const k=$('cname').value.trim(),l=parseNames();if(!k)return err('반 이름을 적어 주세요');if(l.length<2)return err('이름을 두 명 이상 적어 주세요');const prev=classes[k]||{};classes[k]={names:l,looks:prev.looks||{}};saveClasses();fillSel(k);lsSet('duckrace_lastclass',k);err('명단을 저장했어요');};
$('del').onclick=()=>{const k=$('cls').value;if(!k)return;if(!confirm(k+' 명단과 꾸민 오리 모양을 지울까요?'))return;delete classes[k];saveClasses();fillSel('');loadClass('');};
fillSel(lsGet('duckrace_lastclass'));if($('cls').value)loadClass($('cls').value);
$('cnum').textContent=count+'명';setPick(pickMode);

let mode=lsGet('duckrace_mode')||'all';
function setMode(m){mode=m;lsSet('duckrace_mode',m);document.querySelectorAll('.mb,.gb').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 $('legend').textContent=m==='last'?'카메라가 무리 가운데를 따라가요':'카메라가 선두를 따라가요';
 if(roomRef)roomRef.update({mode:m}).catch(()=>{});if(phase==='done')showResult();}
document.querySelectorAll('.mb,.gb').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
setMode(mode);

/* ---------- 그림 ---------- */
const W=320,H=200,WW=1640,FX=1590,SX=14,EX=FX-13,BX=760;
const cv=$('cv'),cx=cv.getContext('2d'),st=$('stage'),mm=$('mm'),mx=mm.getContext('2d');
const bg=document.createElement('canvas');bg.width=WW;bg.height=H;const g=bg.getContext('2d');
function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h);}
function disc(c,x0,y0,r,col){c.fillStyle=col;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(dx*dx+dy*dy<=r*r+r)c.fillRect(x0+dx,y0+dy,1,1);}
function tree(c,x,y,r,a,b){R(c,x-1,y+r-1,3,5,'#3b2412');R(c,x,y+r-1,1,4,'#7a4a21');disc(c,x,y,r+1,'#3b2412');disc(c,x,y,r,a);disc(c,x-1,y-1,Math.max(1,r-2),b);}
function house(c,x,y){R(c,x,y+6,16,9,'#3b2412');R(c,x+1,y+7,14,7,'#f1dfb3');R(c,x+3,y+9,3,5,'#7a4a21');R(c,x+9,y+9,4,3,'#3b2412');R(c,x+10,y+10,2,1,'#9ad1f0');for(let k=0;k<5;k++){R(c,x-2+k,y+5-k,20-2*k,1,'#3b2412');R(c,x-1+k,y+5-k,18-2*k,1,k%2?'#6b7385':'#4b5263');}}
function person(c,x,y,col){R(c,x,y,3,1,'#3b2412');R(c,x,y+1,3,2,'#f2c9a0');R(c,x,y+3,3,3,col);R(c,x,y+6,1,1,'#3b2412');R(c,x+2,y+6,1,1,'#3b2412');}
const TC=[['#f08a24','#ffb347'],['#d9472b','#f2795e'],['#3f9b3a','#6cc24a'],['#e8b92e','#ffe07a']];
const PC=['#e5484d','#3e63dd','#8e4ec6','#f76b15','#12a594','#d6409f'];
const PEOPLE=[];for(let x=20;x<420;x+=26)PEOPLE.push({x:x+(x*7)%9,c:PC[(x/26|0)%6]});for(let x=1240;x<1590;x+=9)PEOPLE.push({x:x+(x*3)%5,c:PC[(x/9|0)%6]});
let parts=[],fwEnd=0;
function drawBG(){
 g.clearRect(0,0,WW,H);
 R(g,0,0,WW,26,'#7cc04a');for(let i=0;i<700;i++)R(g,(i*53)%WW,(i*29)%25,2,1,'#6aae3c');
 R(g,0,15,WW,6,'#e4c27c');R(g,0,15,WW,1,'#c9a35e');
 [30,118,204,300,380].forEach(x=>house(g,x,-1));
 [10,56,76,98,150,170,186,234,254,274,330,352,406].forEach((x,i)=>tree(g,x,6,4,TC[i%2][0],TC[i%2][1]));
 for(let x=440;x<830;x+=46){R(g,x,1,40,13,'#3b2412');R(g,x+1,2,38,11,'#e8c547');for(let k=0;k<5;k++)R(g,x+1,3+k*2,38,1,'#d4a92a');}
 [[560,0],[700,0]].forEach(p=>{R(g,p[0]+3,p[1]+3,1,12,'#7a4a21');R(g,p[0],p[1]+6,7,1,'#7a4a21');R(g,p[0]+1,p[1]+1,5,3,'#3b2412');R(g,p[0]+2,p[1]+2,3,1,'#e8bf5a');R(g,p[0]+2,p[1]+4,3,4,'#3e63dd');});
 [480,620,780].forEach(x=>{disc(g,x,19,3,'#3b2412');disc(g,x,19,2,'#e8bf5a');});
 for(let x=850;x<1220;x+=6){R(g,x,0,3,23,'#3b2412');R(g,x+1,0,1,23,'#5fbf4a');for(let y=3+(x%4);y<22;y+=6)R(g,x,y,3,1,'#2e7d32');R(g,x-2,(x*3)%16,3,1,'#6cc24a');}
 R(g,1240,2,WW-1240,1,'#3b2412');
 [1260,1330,1420,1500].forEach((x,i)=>{for(let k=0;k<8;k++){R(g,x+7-k,5+k,2*k+2,1,'#3b2412');R(g,x+8-k,5+k,2*k,1,k%2?'#fff':PC[i]);}R(g,x,13,18,1,'#3b2412');});
 R(g,0,22,WW,5,'#e6c88a');R(g,0,27,WW,1,'#b8935a');
 R(g,0,28,WW,156,'#3c9fdc');R(g,0,28,WW,4,'#62bdeb');R(g,0,179,WW,4,'#62bdeb');
 R(g,0,183,WW,1,'#b8935a');R(g,0,184,WW,4,'#e6c88a');R(g,0,188,WW,12,'#7cc04a');
 for(let i=0;i<300;i++)R(g,(i*37)%WW,190+(i*7)%9,1,1,['#fff','#ffe14d','#ff8fb1'][i%3]);
 for(let x=22;x<WW;x+=48){if(x>440&&x<830){for(let k=0;k<3;k++)R(g,x+k*3,186,1,8,'#6b8e23');}else tree(g,x,191,3,TC[(x/48|0)%4][0],TC[(x/48|0)%4][1]);}

 d.forEach(o=>{const x=wx(o)-c,bob=Math.sin(t*5+o.ph)>0?0:1,y=laneY(o.i)+bob,tg=tags[o.i],bb=bbs[o.i];
  if(x<-14){behind++;tg.style.display='none';bb.style.visibility='hidden';return;}
  tg.style.display='block';bb.style.visibility='visible';
  const lk=looks[o.i]||defLook(o.i),flip=o.s==='rev'||(o.s==='vortex'&&Math.floor(t*8)%2===1);
  if(o.s==='vortex'){for(let a=0;a<14;a++){const an=a/14*6.28+t*6;R(cx,x+6+Math.cos(an)*9,y+6+Math.sin(an)*3.5,1,1,'#fff');}}
  if(o.s==='rapid'){for(let k=0;k<5;k++)R(cx,x-6-k*4-(t*40%4),y+2+k%3*3,4,1,'#fff');}
  if(o.s==='turtle'){R(cx,x-1,y+7,15,4,'#3b2412');R(cx,x,y+7,13,3,'#4c9a3c');R(cx,x+3,y+7,2,1,'#7cc04a');R(cx,x+14,y+7,3,3,'#7cc04a');}
  if((phase==='race'||phase==='count')&&!o.fin&&o.s!=='nap'&&o.s!=='rev'&&o.s!=='vortex'){const ph=(t*5+o.ph)%1;for(let k=1;k<=3;k++){const off=k*4+ph*4,sp=Math.round(k*1.3+ph);R(cx,x-off,y+8-sp,3,1,k===3?'#7fcdf2':'#c4ecfb');R(cx,x-off,y+10+sp,3,1,k===3?'#7fcdf2':'#c4ecfb');}}
  duck(cx,x,y,lk,flip,t,o.ph);
  if(o.s==='bread'){R(cx,x+8,y-5,5,3,'#3b2412');R(cx,x+9,y-4,3,1,'#f0c27a');}
  if(o.s==='nap'){const z=Math.floor(t*3)%3;R(cx,x+11,y-2-z,3,1,'#fff');R(cx,x+12,y-1-z,1,1,'#fff');R(cx,x+11,y-z,3,1,'#fff');}
  if(o.s==='carp'){const ph=Math.max(0,o.u-t),fy=y+4-Math.sin(ph*3.14)*9;R(cx,x+15,fy,7,4,'#3b2412');R(cx,x+16,fy+1,5,2,'#f08a24');R(cx,x+21,fy,2,4,'#f08a24');R(cx,x+16,fy+1,1,1,'#111');}
  if(o.s==='swap'){R(cx,x+3,y-3,1,1,'#ffe14d');R(cx,x+10,y-2,1,1,'#fff');R(cx,x+6,y-4,1,1,'#fff');}
  if(o.heart>t){heart(cx,x+4,y-7-Math.round((1.3-(o.heart-t))*4));}
  if(o.fin&&o.r<=3){const mc=['#ffd400','#d0d2d8','#d08a3a'][o.r-1];R(cx,x+3,y-3,3,3,'#3b2412');R(cx,x+4,y-2,1,1,mc);}
  tg.style.background=phase==='lobby'?(lk.ready?'#2e8b1f':(claims[o.i]?'#3b2412':'#8a7a60')):'#3b2412';
  tg.style.left=(x/W*100)+'%';tg.style.top=((y+5)/H*100)+'%';bb.style.left=((x+4)/W*100)+'%';bb.style.top=(y/H*100)+'%';});
 for(const q of parts){const sx=q.x-c;if(sx<-3||sx>W)continue;if(q.k==='leaf')R(cx,sx,q.y,2,1,q.c);else if(q.k==='conf')R(cx,sx,q.y,1,2,q.c);else R(cx,sx,q.y,1,1,q.c);}
 if(bx>-30&&bx<W+10){R(cx,bx,24,18,164,'#3b2412');R(cx,bx+1,25,16,162,'#b07a3c');for(let y=27;y<186;y+=4)R(cx,bx+1,y,16,1,'#8a5a2b');R(cx,bx-1,24,2,164,'#7a4a21');R(cx,bx+17,24,2,164,'#7a4a21');for(let y=30;y<186;y+=12){R(cx,bx-2,y,4,3,'#3b2412');R(cx,bx+16,y,4,3,'#3b2412');}}
 const be=$('behind');if(behind){be.style.display='block';be.textContent='◀ 뒤에 '+behind+'마리';}else be.style.display='none';
 mx.fillStyle='#5aa832';mx.fillRect(0,0,320,18);
 ZN.forEach((z,i)=>{const a=4+z[0]/WW*312,b=4+(i<3?ZN[i+1][0]:WW)/WW*312;mx.fillStyle=['#e4c27c','#e8c547','#8fd06a','#f2a0a0'][i];mx.fillRect(a,3,b-a,12);});
 mx.fillStyle='#3c9fdc';mx.fillRect(4,6,312,6);
 d.forEach(o=>{const lk=looks[o.i]||defLook(o.i);mx.fillStyle=(PAL[lk.pal]||PAL[0])[1];mx.fillRect(Math.round(4+wx(o)/WW*312),6+(o.i%3)*2,2,2);});
 mx.strokeStyle='#3b2412';mx.lineWidth=1;mx.strokeRect(Math.round(4+cam/WW*312)+0.5,1.5,Math.round(W/WW*312),15);
 mx.fillStyle='#3b2412';mx.fillRect(Math.round(4+FX/WW*312),2,1,14);}

function panel(){
 if(phase==='lobby'){let on=0,rd=0;$('rk').innerHTML=names.map((n,i)=>{const c=!!claims[i],r=c&&looks[i]&&looks[i].ready;if(c)on++;if(r)rd++;return '<span class="'+(r?'rd':c?'':'off')+'"><b>'+(nums[i]||i+1)+'</b>'+esc(pickMode==='num'&&/^\d+번$/.test(n)?'':n)+'</span>';}).join('');
  $('lcnt').textContent='접속 '+on+' · 준비 '+rd+' / '+N;$('lead').textContent='대기 중';$('prog').textContent='0m / 200m';return;}
 const o=d.slice().sort((a,b)=>a.fin&&b.fin?a.r-b.r:a.fin?-1:b.fin?1:b.p-a.p);
 $('rk').innerHTML=o.map((x,i)=>'<span class="'+(x.fin?'f':'')+'"><b>'+(i+1)+'</b>'+esc(x.n)+'</span>').join('');
 $('lead').textContent='선두: '+o[0].n;$('prog').textContent=Math.round(Math.max(...d.map(x=>x.p))*200)+'m / 200m';}

function updParts(dt){
 if(cam<440&&Math.random()<dt*7)parts.push({k:'leaf',x:cam+Math.random()*W,y:4+Math.random()*16,vx:6+Math.random()*6,vy:9+Math.random()*6,ty:40+Math.random()*130,life:7,c:['#f08a24','#d9472b','#ffb347','#e8b92e'][Math.floor(Math.random()*4)],ph:Math.random()*6});
 if(t<fwEnd){if(Math.random()<dt*3.5){const bx=FX-25-Math.random()*90,by=40+Math.random()*60,col=PC[Math.floor(Math.random()*6)];for(let k=0;k<26;k++){const a=k/26*6.28,sp=18+Math.random()*14;parts.push({k:'fw',x:bx,y:by,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1.1+Math.random()*0.4,c:k%3?col:'#fff6d8'});}}
  if(Math.random()<dt*25)parts.push({k:'conf',x:FX-120+Math.random()*130,y:-2,vx:0,vy:22+Math.random()*12,life:9,c:PC[Math.floor(Math.random()*6)].replace('#','#'),ph:Math.random()*6});}
 for(const q of parts){q.life-=dt;
  if(q.k==='leaf'){if(q.y<q.ty){q.y+=q.vy*dt;q.x+=(q.vx+Math.sin(t*3+q.ph)*8)*dt;}else{q.x+=4*dt;}}
  else if(q.k==='fw'){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=20*dt;q.vx*=0.98;}
  else{q.y+=q.vy*dt;q.x+=Math.sin(t*4+q.ph)*10*dt;if(q.y>180)q.life=0;}}
 if(parts.length>500)parts.splice(0,parts.length-500);
 parts=parts.filter(q=>q.life>0);}
let last=performance.now(),pt=0,st2=0;
function loop(n){const dt=Math.min(0.05,(n-last)/1000);last=n;
 if(phase!=='setup'){
  if(phase==='count'){const rem=Math.ceil((cdEnd-n)/1000);if(rem>0){msg.classList.add('cd');msg.textContent=rem;msg.style.display='block';clearTimeout(msg._t);}else{phase='race';say('출발! '+N+'마리 오리가 단풍 마을을 지나갑니다',2200);}t+=dt;}
  else if(phase==='race')step(dt);else t+=dt;
  const tgt=Math.min(WW-W,Math.max(0,camTarget()));cam+=(tgt-cam)*Math.min(1,dt*2.5);
  updParts(dt);scene();pt+=dt;if(pt>0.25){pt=0;panel();}
  if(phase==='race'||phase==='count'){st2+=dt;if(st2>0.25){st2=0;pushState();}}}
 requestAnimationFrame(loop);}
requestAnimationFrame(loop);
